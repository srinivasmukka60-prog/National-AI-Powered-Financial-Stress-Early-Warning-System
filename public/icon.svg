<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="6" />

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-width="2" />

  <!-- Shield Shape -->
  <path d="M 256,96 L 380,146 C 380,268 330,358 256,416 C 182,358 132,268 132,146 Z"
        fill="#0f172a" stroke="url(#gold)" stroke-width="12" filter="url(#glow)" />

  <!-- Financial Stress Trend Wave / Pulse -->
  <path d="M 180,260 L 220,290 L 256,210 L 292,270 L 332,230"
        fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Intelligence Node -->
  <circle cx="256" cy="210" r="12" fill="#38bdf8" />
  <circle cx="256" cy="210" r="22" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.6" />

  <!-- Text / Badge -->
  <text x="256" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">SENTINEL</text>
  <text x="256" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3">AI EARLY WARNING</text>
</svg>
